<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#DD8FA3">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #F7E4E9;
    --ink: #3A2430;
    --pink: #DD8FA3;
    --pink-soft: #F0D7DE;
    --muted: #A5808E;
    --accent-fill: var(--pink);
    --accent-text: white;
    --frame-border: #E1A7B5;
    --row-bg: #FEF6F8;
  }
  [data-theme="white"] {
    --bg: #F7EEDD;
    --ink: #3A2E1F;
    --pink: #71743A;
    --pink-soft: #E4E0C9;
    --muted: #8A7F63;
    --accent-fill: #71743A;
    --accent-text: white;
    --frame-border: #71743A;
    --row-bg: rgb(255, 253, 250);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: 'Yomogi', cursive;
    min-height: 100vh;
    background-color: var(--bg);
  }
  .bg-fixed {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: -1;
    background-color: var(--bg);
    background-image: url("bg-pink.jpg");
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center;
  }
  [data-theme="white"] .bg-fixed {
    background-image: url("bg-white.png");
  }
  .app-shell {
    position: relative;
    display: flex;
    max-width: 780px;
    margin: 0 auto;
    min-height: 100vh;
  }
  .tabs-sidebar {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 48px 12px 24px;
    width: 130px;
    flex-shrink: 0;
  }
  .tab-btn {
    font-family: 'Yomogi', cursive;
    font-weight: 700;
    font-size: 20px;
    background: rgba(255,255,255,0.75);
    border: 2px solid var(--pink-soft);
    border-radius: 14px;
    padding: 14px 8px;
    cursor: pointer;
    color: var(--muted);
    transition: all 0.15s ease;
  }
  .tab-btn.active {
    background: var(--accent-fill);
    color: var(--accent-text);
    border-color: var(--pink);
  }
  .content {
    flex: 1;
    max-width: 480px;
    margin: 28px 20px 28px auto;
    margin-left: auto;
    margin-right: auto;
    padding: 30px 26px 56px;
    min-width: 0;
    background: rgba(255, 248, 250, 0.78);
    border: 3px solid var(--frame-border);
    border-radius: 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
  }
  .panel { display: none; }
  .panel.active { display: block; }

  h1.page-title {
    font-family: 'Yomogi', cursive;
    font-size: 40px;
    font-weight: 700;
    margin: 0 0 4px;
    line-height: 1;
  }
  .date-label {
    font-size: 15px;
    color: var(--muted);
    margin: 0 0 20px;
  }

  .section { margin-bottom: 34px; }

  .section-title {
    font-family: 'Yomogi', cursive;
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 10px;
  }

  .add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    min-width: 0;
  }
  .add-row input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid var(--pink-soft);
    font-family: 'Yomogi', cursive;
    font-size: 16px;
    background: white;
    outline: none;
  }
  .add-row input[type="text"]:focus { border-color: var(--pink); }
  .add-btn {
    flex-shrink: 0;
    background: var(--accent-fill);
    color: var(--accent-text);
    border: 2px solid var(--pink);
    border-radius: 12px;
    padding: 0 18px;
    font-family: 'Yomogi', cursive;
    font-weight: 700;
    font-size: 17px;
    cursor: pointer;
  }
  .add-btn:active { transform: scale(0.96); }

  .tasks { display: flex; flex-direction: column; gap: 6px; }

  .task-row {
    position: relative;
    overflow: hidden;
    border-radius: 8px;
    -webkit-user-select: none;
    user-select: none;
  }
  body.is-dragging, body.is-dragging * {
    -webkit-user-select: none !important;
    user-select: none !important;
    cursor: grabbing !important;
  }
  .task-row.dragging {
    opacity: 0.9;
    box-shadow: 0 8px 16px rgba(0,0,0,0.15);
    z-index: 10;
  }
  .del-btn-bg {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--pink);
    z-index: 1;
  }
  .del-btn {
    background: none; border: none; color: white;
    font-size: 24px; cursor: pointer;
    width: 100%; height: 100%;
  }
  .task-row-inner {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 2px;
    background: var(--row-bg);
    touch-action: pan-y;
  }
  .task-row-inner.swiping { transition: none; }
  .task-row-inner:not(.swiping) { transition: transform 0.2s ease; }
  .drag-handle {
    color: var(--muted);
    font-size: 20px;
    line-height: 1;
    padding: 6px 8px;
    flex-shrink: 0;
    touch-action: none;
    cursor: grab;
    letter-spacing: 1px;
  }
  .bullet {
    width: 12px;
    height: 12px;
    min-width: 12px;
    flex-shrink: 0;
    align-self: center;
    border: 2px solid var(--ink);
    border-radius: 52% 48% 50% 50% / 50% 52% 48% 50%;
    cursor: pointer;
    transform: translateY(1px);
  }
  .bullet.done {
    background: var(--ink);
  }
  .task-text {
    flex: 1;
    font-size: 18px;
    word-break: break-word;
  }
  .task-row.done .task-text {
    text-decoration: line-through;
    color: var(--muted);
  }
  .task-edit-input {
    flex: 1;
    min-width: 0;
    font-family: 'Yomogi', cursive;
    font-size: 18px;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--pink);
    outline: none;
    padding: 0;
    -webkit-user-select: text;
    user-select: text;
  }

  @media (max-width: 640px) {
    .app-shell { flex-direction: column; }
    .tabs-sidebar {
      flex-direction: row;
      width: auto;
      padding: 44px 16px 0;
    }
    .tab-btn { flex: 1; }
    .content {
      margin: 16px 14px 20px;
      max-width: none;
      border-radius: 14px;
    }
  }

  .settings-btn {
    position: absolute;
    top: 14px;
    right: 18px;
    z-index: 50;
    width: auto;
    height: auto;
    border: none;
    background: transparent;
    color: var(--pink);
    font-size: 20px;
    line-height: 1;
    letter-spacing: 1px;
    padding: 4px 6px;
    cursor: pointer;
  }

  .settings-panel {
    position: absolute;
    top: 40px;
    right: 14px;
    z-index: 50;
    background: white;
    border: 2px solid var(--pink-soft);
    border-radius: 14px;
    padding: 10px;
    display: none;
    flex-direction: column;
    gap: 6px;
    min-width: 140px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
  }
  .settings-panel.open { display: flex; }
  .settings-panel .panel-label {
    font-family: 'Yomogi', cursive;
    font-size: 15px;
    color: var(--muted);
    margin: 0 0 2px 4px;
  }
  .theme-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 10px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-family: 'Yomogi', cursive;
    font-size: 16px;
    color: var(--ink);
    text-align: left;
  }
  .theme-option:hover { background: var(--pink-soft); }
  .theme-option .swatch {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.15);
  }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="bg-fixed"></div>
<div class="app-shell">
  <button class="settings-btn" id="settingsBtn" aria-label="Settings">&#8226;&#8226;&#8226;</button>
  <div class="settings-panel" id="settingsPanel">
    <p class="panel-label">Theme</p>
    <button class="theme-option" data-theme-choice="pink">
      <span class="swatch" style="background:#DD8FA3"></span> Pink
    </button>
    <button class="theme-option" data-theme-choice="white">
      <span class="swatch" style="background:white"></span> White
    </button>
    <p class="panel-label" style="margin-top:10px;">Sync</p>
    <button class="theme-option" id="signInBtn">Sign in with Google</button>
    <button class="theme-option" id="signOutBtn" style="display:none;">
      Sign out (<span id="userEmail"></span>)
    </button>
    <p class="panel-label" id="syncStatus" style="margin-top:6px; font-size:12px; word-break:break-word;"></p>
  </div>
  <div class="tabs-sidebar">
    <button class="tab-btn active" data-tab="todo">To Do</button>
    <button class="tab-btn" data-tab="reminders">Reminders</button>
  </div>

  <div class="content">
    <div class="panel active" id="panel-todo">
      <h1 class="page-title">To Do</h1>
      <p class="date-label" id="dateLabel"></p>

      <div class="section">
        <p class="section-title">Today</p>
        <div class="add-row">
          <input type="text" id="inputToday" placeholder="Add a task for today..." maxlength="300">
          <button class="add-btn" data-list="today">Add</button>
        </div>
        <div class="tasks" id="list-today"></div>
      </div>

      <div class="section">
        <p class="section-title">Tomorrow</p>
        <div class="add-row">
          <input type="text" id="inputTomorrow" placeholder="Add a task for tomorrow..." maxlength="300">
          <button class="add-btn" data-list="tomorrow">Add</button>
        </div>
        <div class="tasks" id="list-tomorrow"></div>
      </div>

      <div class="section">
        <p class="section-title">Future Tasks</p>
        <div class="add-row">
          <input type="text" id="inputFuture" placeholder="Add something for later..." maxlength="300">
          <button class="add-btn" data-list="future">Add</button>
        </div>
        <div class="tasks" id="list-future"></div>
      </div>
    </div>

    <div class="panel" id="panel-reminders">
      <h1 class="page-title">Reminders</h1>

      <div class="add-row">
        <input type="text" id="inputReminders" placeholder="Add a reminder..." maxlength="300">
        <button class="add-btn" data-list="reminders">Add</button>
      </div>
      <div class="tasks" id="list-reminders"></div>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'planner:data:v3';
  let data = { today: [], tomorrow: [], future: [], reminders: [], lastDate: null };

  // --- Firebase setup ---
  const firebaseConfig = {
    apiKey: "AIzaSyBDP6WaEG1JF-QoVcbY7c9g8jHVtSzwJV4",
    authDomain: "my-planner-ccc1c.firebaseapp.com",
    projectId: "my-planner-ccc1c",
    storageBucket: "my-planner-ccc1c.firebasestorage.app",
    messagingSenderId: "766340014526",
    appId: "1:766340014526:web:be1e8756912f1e39e359ef"
  };
  let auth = null;
  let db = null;
  let firebaseReady = false;
  try {
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.firestore();
    firebaseReady = true;
  } catch (e) {
    console.error('Firebase failed to load (sync will be unavailable):', e);
  }
  let currentUser = null;
  let unsubscribeSnapshot = null;
  let suppressCloudWrite = false;

  function cloudDocRef(uid) {
    return db.collection('planners').doc(uid);
  }

  // the planning "day" rolls over at 3am, not midnight
  function planningDateStr() {
    const d = new Date();
    const shifted = new Date(d.getTime() - 3 * 60 * 60 * 1000);
    return shifted.toDateString();
  }

  function applyRollover() {
    const nowStr = planningDateStr();
    if (data.lastDate !== nowStr) {
      data.today = (data.today || []).filter(t => !t.done).concat(data.tomorrow || []);
      data.tomorrow = [];
      data.future = (data.future || []).filter(t => !t.done);
      data.lastDate = nowStr;
      return true;
    }
    return false;
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) data = JSON.parse(raw);
    } catch (e) { /* keep defaults */ }
    if (applyRollover()) save();
  }

  function setSyncStatus(msg) {
    const el = document.getElementById('syncStatus');
    if (el) el.textContent = msg;
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) { console.error('Could not save', e); }
    if (firebaseReady && currentUser && !suppressCloudWrite) {
      cloudDocRef(currentUser.uid).set(data)
        .then(() => setSyncStatus('Synced ' + new Date().toLocaleTimeString()))
        .catch(e => setSyncStatus('Save error: ' + e.message));
    }
  }

  if (firebaseReady) auth.onAuthStateChanged((user) => {
    currentUser = user;
    updateAuthUI();
    if (unsubscribeSnapshot) { unsubscribeSnapshot(); unsubscribeSnapshot = null; }
    if (!user) { return; }
    setSyncStatus('Connecting…');

    unsubscribeSnapshot = cloudDocRef(user.uid).onSnapshot((snap) => {
      suppressCloudWrite = true;
      if (snap.exists) {
        data = snap.data();
        if (applyRollover()) {
          suppressCloudWrite = false;
          save();
          suppressCloudWrite = true;
        }
      } else {
        // first sign-in on this account: seed the cloud with whatever's local
        cloudDocRef(user.uid).set(data).catch(e => setSyncStatus('Setup error: ' + e.message));
      }
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
      suppressCloudWrite = false;
      setSyncStatus('Synced ' + new Date().toLocaleTimeString());
      renderAll();
    }, (err) => setSyncStatus('Sync error: ' + err.message));
  });



  function updateAuthUI() {
    const signInBtn = document.getElementById('signInBtn');
    const signOutBtn = document.getElementById('signOutBtn');
    const userLabel = document.getElementById('userEmail');
    if (!signInBtn || !signOutBtn) return;
    if (currentUser) {
      signInBtn.style.display = 'none';
      signOutBtn.style.display = 'flex';
      userLabel.textContent = currentUser.email || currentUser.displayName || 'Signed in';
    } else {
      signInBtn.style.display = 'flex';
      signOutBtn.style.display = 'none';
    }
  }

  function closeAllSwipes(except) {
    document.querySelectorAll('.task-row-inner').forEach(inner => {
      if (inner !== except) inner.style.transform = 'translateX(0px)';
    });
  }

  function renderTaskEl(t, listName) {
    const el = document.createElement('div');
    el.className = 'task-row' + (t.done ? ' done' : '');
    el.innerHTML = `
      <div class="del-btn-bg"><button class="del-btn">&times;</button></div>
      <div class="task-row-inner">
        <span class="bullet ${t.done ? 'done' : ''}"></span>
        <span class="task-text"></span>
        <span class="drag-handle">&#8942;</span>
      </div>
    `;
    el.dataset.id = t.id;

    const inner = el.querySelector('.task-row-inner');
    inner.querySelector('.task-text').textContent = t.text;

    // --- drag handle: press and drag the dots to reorder ---
    // The dragged row follows the pointer; the other rows slide out of the way.
    // Nothing is moved in the DOM until you let go, so there is no snapping.
    const handle = inner.querySelector('.drag-handle');
    handle.addEventListener('mousedown', (e) => e.preventDefault());
    handle.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      const rows = Array.from(el.parentElement.children);
      const fromIndex = rows.indexOf(el);
      if (fromIndex < 0) return;

      const GAP = 6; // matches the gap in .tasks
      const scrollY0 = window.scrollY;
      const rects = rows.map(r => r.getBoundingClientRect());
      const mids = rects.map(r => r.top + scrollY0 + r.height / 2);
      const shift = rects[fromIndex].height + GAP;
      const startPageY = e.pageY;
      let toIndex = fromIndex;

      closeAllSwipes();
      if (window.getSelection) window.getSelection().removeAllRanges();
      document.body.classList.add('is-dragging');
      el.classList.add('dragging');
      el.style.transition = 'none';
      rows.forEach(r => { if (r !== el) r.style.transition = 'transform 0.15s ease'; });
      try { handle.setPointerCapture(e.pointerId); } catch (err) {}
      if (navigator.vibrate) navigator.vibrate(10);

      function onMove(ev) {
        const dy = ev.pageY - startPageY;
        el.style.transform = `translateY(${dy}px)`;
        const center = mids[fromIndex] + dy;
        let idx = 0;
        rows.forEach((r, i) => { if (i !== fromIndex && mids[i] < center) idx++; });
        if (idx === toIndex) return;
        toIndex = idx;
        rows.forEach((r, i) => {
          if (i === fromIndex) return;
          let y = 0;
          if (fromIndex < toIndex && i > fromIndex && i <= toIndex) y = -shift;
          else if (fromIndex > toIndex && i >= toIndex && i < fromIndex) y = shift;
          r.style.transform = y ? `translateY(${y}px)` : '';
        });
      }
      function onEnd(ev) {
        handle.removeEventListener('pointermove', onMove);
        handle.removeEventListener('pointerup', onEnd);
        handle.removeEventListener('pointercancel', onEnd);
        document.body.classList.remove('is-dragging');
        if (ev.type !== 'pointercancel' && toIndex !== fromIndex) {
          const list = data[listName];
          const moved = list.splice(fromIndex, 1)[0];
          list.splice(toIndex, 0, moved);
          save();
        }
        renderAll();
      }
      handle.addEventListener('pointermove', onMove);
      handle.addEventListener('pointerup', onEnd);
      handle.addEventListener('pointercancel', onEnd);
    });

    // --- swipe left on the row to reveal delete ---
    const SWIPE_WIDTH = 64;
    let swiping = false;
    let sStartX = 0, sStartY = 0, sCurX = 0;
    let decided = false; // has direction been determined yet
    let moved = false;   // true if the pointer travelled (so a tap is not a tap)

    inner.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.bullet') || e.target.closest('.drag-handle') || e.target.closest('.task-edit-input')) return;
      sStartX = e.clientX;
      sStartY = e.clientY;
      sCurX = 0;
      decided = false;
      swiping = false;
      moved = false;
    });
    inner.addEventListener('pointermove', (e) => {
      if (sStartX === 0 && sStartY === 0) return;
      const dx = e.clientX - sStartX;
      const dy = e.clientY - sStartY;
      if (!decided) {
        if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
          decided = true;
          moved = true;
          swiping = Math.abs(dx) > Math.abs(dy) * 1.2;
          if (swiping) {
            closeAllSwipes(inner);
            inner.classList.add('swiping');
            try { inner.setPointerCapture(e.pointerId); } catch (err) {}
          }
        }
      }
      if (swiping) {
        sCurX = Math.max(-SWIPE_WIDTH, Math.min(0, dx));
        inner.style.transform = `translateX(${sCurX}px)`;
      }
    });
    function endSwipe() {
      if (swiping) {
        inner.classList.remove('swiping');
        inner.style.transform = sCurX < -SWIPE_WIDTH / 2 ? `translateX(-${SWIPE_WIDTH}px)` : 'translateX(0px)';
      }
      sStartX = 0; sStartY = 0; swiping = false; decided = false;
    }
    inner.addEventListener('pointerup', endSwipe);
    inner.addEventListener('pointercancel', endSwipe);

    // --- tap the words to edit them ---
    const textEl = inner.querySelector('.task-text');
    textEl.addEventListener('click', () => {
      if (moved) { moved = false; return; }
      if (inner.style.transform === `translateX(-${SWIPE_WIDTH}px)`) { closeAllSwipes(); return; }
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'task-edit-input';
      input.maxLength = 300;
      input.value = t.text;
      textEl.replaceWith(input);
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
      let finished = false;
      function finish(commit) {
        if (finished) return;
        finished = true;
        const v = input.value.trim();
        if (commit && v && v !== t.text) {
          t.text = v;
          save();
        }
        renderAll();
      }
      input.addEventListener('blur', () => finish(true));
      input.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter') { ev.preventDefault(); finish(true); }
        else if (ev.key === 'Escape') { finish(false); }
      });
    });

    inner.querySelector('.bullet').addEventListener('click', () => {
      closeAllSwipes();
      if (listName === 'reminders') {
        data.reminders = data.reminders.filter(x => x.id !== t.id);
      } else {
        t.done = !t.done;
      }
      save();
      renderAll();
    });
    el.querySelector('.del-btn').addEventListener('click', () => {
      data[listName] = data[listName].filter(x => x.id !== t.id);
      save();
      renderAll();
    });
    return el;
  }

  function renderList(listName) {
    const container = document.getElementById('list-' + listName);
    container.innerHTML = '';
    (data[listName] || []).forEach(t => container.appendChild(renderTaskEl(t, listName)));
  }

  function renderAll() {
    ['today', 'tomorrow', 'future', 'reminders'].forEach(renderList);
    document.getElementById('dateLabel').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  }

  function addTask(listName, inputEl) {
    const text = inputEl.value.trim();
    if (!text) return;
    data[listName] = data[listName] || [];
    data[listName].push({
      id: 'task_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
      text,
      done: false
    });
    inputEl.value = '';
    save();
    renderAll();
  }

  document.querySelectorAll('.add-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const listName = btn.dataset.list;
      const inputMap = { today: 'inputToday', tomorrow: 'inputTomorrow', future: 'inputFuture', reminders: 'inputReminders' };
      addTask(listName, document.getElementById(inputMap[listName]));
    });
  });
  ['inputToday', 'inputTomorrow', 'inputFuture', 'inputReminders'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const listMap = { inputToday: 'today', inputTomorrow: 'tomorrow', inputFuture: 'future', inputReminders: 'reminders' };
        addTask(listMap[id], document.getElementById(id));
      }
    });
  });

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  load();
  renderAll();

  // theme switching
  const THEME_KEY = 'planner:theme';
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPanel = document.getElementById('settingsPanel');

  function applyTheme(theme) {
    if (theme === 'white') {
      document.documentElement.setAttribute('data-theme', 'white');
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
  }

  const savedTheme = localStorage.getItem(THEME_KEY) || 'pink';
  applyTheme(savedTheme);

  settingsBtn.addEventListener('click', () => {
    settingsPanel.classList.toggle('open');
  });

  document.querySelectorAll('.theme-option[data-theme-choice]').forEach(btn => {
    btn.addEventListener('click', () => {
      const theme = btn.dataset.themeChoice;
      applyTheme(theme);
      localStorage.setItem(THEME_KEY, theme);
      settingsPanel.classList.remove('open');
    });
  });

  document.getElementById('signInBtn').addEventListener('click', () => {
    if (!firebaseReady) { setSyncStatus('Cloud sync unavailable here'); return; }
    const provider = new firebase.auth.GoogleAuthProvider();
    setSyncStatus('Opening sign-in…');
    auth.signInWithPopup(provider)
      .catch((e) => setSyncStatus('Sign-in error: ' + e.message));
  });
  document.getElementById('signOutBtn').addEventListener('click', () => {
    if (firebaseReady) auth.signOut();
    settingsPanel.classList.remove('open');
  });

  document.addEventListener('click', (e) => {
    if (!settingsPanel.contains(e.target) && e.target !== settingsBtn) {
      settingsPanel.classList.remove('open');
    }
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((e) => console.error('SW registration failed', e));
    });
  }
</script>
</body>
</html>
